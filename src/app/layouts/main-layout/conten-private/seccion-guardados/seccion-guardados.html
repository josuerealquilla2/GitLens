<div class="coleccion">
  <div class="coleccion__header">
    <h2 class="coleccion__title">
      <i class="bi bi-journal-code" style="color:#5ca8ff"></i> Guardados
    </h2>
    <p class="coleccion__sub">Repositorios que guardaste para leer después</p>
  </div>

  @if (loading()) {
    <div class="coleccion__loading"><div class="spinner"></div></div>
  }

  @if (!loading() && repos().length === 0) {
    <div class="coleccion__empty">
      <i class="bi bi-journal-code"></i>
      <p>Aún no tienes repositorios guardados.</p>
      <small>Usa el icono 🔖 en las tarjetas para guardarlos.</small>
    </div>
  }

  @if (repos().length > 0) {
    <div class="coleccion__grid">
      @for (repo of repos(); track repo.id) {
        <app-repo-card [repo]="repo" [isAuthenticated]="true" />
      }
    </div>
  }
</div>
