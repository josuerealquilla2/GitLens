<div class="coleccion">
  <div class="coleccion__header">
    <h2 class="coleccion__title">
      <i class="bi bi-star-fill" style="color:#ffd700"></i> Favoritos
    </h2>
    <p class="coleccion__sub">Repositorios que marcaste como favoritos</p>
  </div>

  @if (loading()) {
    <div class="coleccion__loading"><div class="spinner"></div></div>
  }

  @if (!loading() && repos().length === 0) {
    <div class="coleccion__empty">
      <i class="bi bi-star"></i>
      <p>Aún no tienes repositorios favoritos.</p>
      <small>Usa el icono ⭐ en las tarjetas para agregarlos.</small>
    </div>
  }

  @if (repos().length > 0) {
    <div class="coleccion__grid">
      @for (repo of repos(); track repo.id) {
        <app-repo-card [repo]="repo" [isAuthenticated]="true" />
      }
    </div>
  }
</div>
